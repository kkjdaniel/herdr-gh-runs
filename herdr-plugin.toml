id = "kkjdaniel.gh-runs"
name = "gh-runs"
version = "0.1.0"
min_herdr_version = "0.9.0"
platforms = ["macos", "linux"]
description = "GitHub Actions runs for the account logged in via gh, following the repo you're working in."

[[panes]]
id = "runs"
title = "CI runs"
placement = "split"
# Run by absolute path: a pane opened with --cwd starts in that directory.
command = ["/bin/sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/gh_runs.py\""]

# Run details/logs open here; the command comes in via GH_RUNS_CMD.
[[panes]]
id = "detail"
title = "CI run"
placement = "popup"
width = "90%"
height = "85%"
command = ["/bin/bash", "-c", "exec /bin/bash -c \"$GH_RUNS_CMD\""]

[[actions]]
id = "toggle"
title = "gh-runs: toggle CI runs pane"
contexts = ["global", "workspace", "pane"]
command = ["python3", "gh_runs.py", "--toggle"]
