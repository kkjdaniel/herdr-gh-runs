<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="gh-runs: GitHub Actions in a herdr pane">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b26"/>
      <stop offset="1" stop-color="#0b0f15"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2330"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0f15" stop-opacity="1"/>
      <stop offset="0.62" stop-color="#0b0f15" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#dots)"/>

  <!-- Faint run list on the right, like the pane -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" opacity="0.6">
    <g transform="translate(846 78)">
      <text x="0" y="0" fill="#39c5cf" font-weight="700">storefront</text>
      <text x="390" y="0" fill="#6e7681" text-anchor="end">mine · 4s ago</text>
      <line x1="0" y1="14" x2="390" y2="14" stroke="#2a3342" stroke-width="2"/>
      <rect x="-8" y="27" width="406" height="30" rx="6" fill="#2b3343"/>
      <text x="0" y="48" fill="#e3b341">◐</text><text x="26" y="48" fill="#f0f6fc">Add retry to webhooks</text><text x="390" y="48" fill="#e3b341" text-anchor="end">1m19s</text>
      <text x="0" y="85" fill="#f85149">✗</text><text x="26" y="85" fill="#c9d1d9">Fix rounding in totals</text><text x="390" y="85" fill="#6e7681" text-anchor="end">2m34s</text>
      <text x="0" y="122" fill="#3fb950">✓</text><text x="26" y="122" fill="#c9d1d9">Cache pnpm store in CI</text><text x="390" y="122" fill="#6e7681" text-anchor="end">2m11s</text>
      <text x="0" y="159" fill="#3fb950">✓</text><text x="26" y="159" fill="#c9d1d9">Bump vite to 5.4.10</text><text x="390" y="159" fill="#6e7681" text-anchor="end">2m08s</text>
      <text x="0" y="196" fill="#3fb950">✓</text><text x="26" y="196" fill="#c9d1d9">Release v2.3.0</text><text x="390" y="196" fill="#6e7681" text-anchor="end">5m05s</text>
    </g>
  </g>
  <rect width="1280" height="360" rx="24" fill="url(#fade)"/>

  <!-- Logo (same drawing as assets/logo.svg) -->
  <g transform="translate(84 76) scale(1.6)">
    <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#tile)"/>
    <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="25.25" fill="none" stroke="#30394a" stroke-width="1.5"/>
    <rect x="22" y="24" width="34" height="7" rx="3.5" fill="#39c5cf"/>
    <rect x="88" y="24" width="18" height="7" rx="3.5" fill="#4b5563"/>
    <line x1="22" y1="40" x2="106" y2="40" stroke="#2a3342" stroke-width="2" stroke-linecap="round"/>
    <circle cx="29" cy="56" r="7" fill="#3fb950"/>
    <path d="M25.6 56.2l2.4 2.4 4.6-4.8" fill="none" stroke="#0d1117" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="42" y="52" width="64" height="8" rx="4" fill="#c9d1d9"/>
    <rect x="15" y="68" width="98" height="20" rx="7" fill="#2b3343"/>
    <circle cx="29" cy="78" r="6" fill="none" stroke="#e3b341" stroke-width="2.6" stroke-dasharray="26 12" stroke-linecap="round" transform="rotate(-40 29 78)"/>
    <rect x="42" y="74" width="50" height="8" rx="4" fill="#f0f6fc"/>
    <rect x="96" y="74" width="10" height="8" rx="4" fill="#e3b341"/>
    <circle cx="29" cy="100" r="7" fill="#f85149"/>
    <path d="M26.2 97.2l5.6 5.6M31.8 97.2l-5.6 5.6" stroke="#0d1117" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="42" y="96" width="40" height="8" rx="4" fill="#8b949e"/>
  </g>

  <!-- Name and tagline -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="320" y="160" fill="#f0f6fc" font-size="76" font-weight="700" letter-spacing="-1.5">gh-runs</text>
    <text x="324" y="206" fill="#9aa4b2" font-size="26">GitHub Actions in a herdr pane</text>
    <text x="324" y="252" fill="#6e7681" font-size="19" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">live status · step logs · notifications</text>
  </g>
</svg>
